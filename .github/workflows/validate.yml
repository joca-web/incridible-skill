name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python tools/validate.py
      - name: Smoke test the installer
        run: |
          CLAUDE_HOME="$RUNNER_TEMP/claude" ./install.sh
          test -f "$RUNNER_TEMP/claude/skills/incridible-skill/SKILL.md"
          CLAUDE_HOME="$RUNNER_TEMP/claude" ./install.sh --uninstall
          test ! -d "$RUNNER_TEMP/claude/skills/incridible-skill"
